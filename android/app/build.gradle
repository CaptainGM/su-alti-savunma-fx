plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kule.savunma.mobil'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kule.savunma.mobil'
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Oyunun web dosyaları kopyalanmadan doğrudan uygulamaya katılır; masaüstü, tarayıcı ve Android aynı kaynağı kullanır
    sourceSets {
        main {
            assets.srcDirs = ['../../src/main/resources/web']
        }
    }

    lint {
        abortOnError false
    }
}

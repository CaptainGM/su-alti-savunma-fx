name: Sürüm yayınla

# Herkesin giriş yapmadan indirebileceği "Sürüm" (Release) sayfası üretir: Windows uygulaması (zip) ve imzalı Android APK'sı.
# Dosya adları sürümden bağımsızdır; bu yüzden şu bağlantılar her zaman EN YENİ sürümü indirir:
#   https://github.com/CaptainGM/su-alti-savunma-fx/releases/latest/download/SuAltiSavunma.apk
#   https://github.com/CaptainGM/su-alti-savunma-fx/releases/latest/download/SuAltiSavunma-Windows.zip
#
# Üç yolla çalışır:
#   1) Kendiliğinden: pom.xml'deki sürümü yükseltip main'e gönderince, o sürüm için henüz sürüm sayfası yoksa yayınlar
#      (sürüm sayfası zaten varsa hiçbir şey yapmaz; her gönderimde yalnızca birkaç saniyelik bir denetim çalışır).
#   2) Elle etiketle:  git tag v2.2.0 && git push origin v2.2.0
#   3) Denemek için:   Actions > "Sürüm yayınla" > Run workflow  (TASLAK oluşturur; Releases sayfasında kontrol edip
#                      "Publish release" dersin ya da silersin)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      taslak:
        description: 'Taslak olarak oluştur (yayınlamadan önce kontrol edebilirsin)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  kontrol:
    name: Yayınlanacak mı?
    runs-on: ubuntu-24.04
    outputs:
      yayinla: ${{ steps.karar.outputs.yayinla }}
      etiket: ${{ steps.karar.outputs.etiket }}
    steps:
      - uses: actions/checkout@v7
      - id: karar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SURUM=$(sed -n 's:.*<version>\([0-9]*\.[0-9]*\.[0-9]*\)</version>.*:\1:p' pom.xml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ETIKET="${GITHUB_REF_NAME}"; else ETIKET="v${SURUM}"; fi
          YAYINLA=true
          # main'e yapılan push'ta yalnızca o sürüm için sürüm sayfası yoksa yayınla (pom.xml'in başka bir yerinin değişmesi yeni sürüm üretmesin)
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            if gh release view "${ETIKET}" >/dev/null 2>&1; then YAYINLA=false; fi
          fi
          echo "etiket=${ETIKET}" >> "$GITHUB_OUTPUT"
          echo "yayinla=${YAYINLA}" >> "$GITHUB_OUTPUT"
          echo "Sürüm ${ETIKET}, yayınlanacak mı: ${YAYINLA}"

  windows:
    name: Windows uygulaması
    runs-on: windows-latest
    needs: kontrol
    if: needs.kontrol.outputs.yayinla == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Derle ve paketle
        shell: pwsh
        run: ./tools/paketle.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/SuAltiSavunma-windows.zip

  android:
    name: Android APK (imzalı)
    runs-on: ubuntu-24.04
    needs: kontrol
    if: needs.kontrol.outputs.yayinla == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: İmza anahtarını hazırla
        env:
          ANAHTAR_B64: ${{ secrets.ANAHTAR_B64 }}
        run: |
          if [ -n "$ANAHTAR_B64" ]; then
            echo "$ANAHTAR_B64" | base64 -d > "$RUNNER_TEMP/anahtar.jks"
            echo "ANAHTAR_DOSYASI=$RUNNER_TEMP/anahtar.jks" >> "$GITHUB_ENV"
            echo "İmza anahtarı bulundu."
          else
            echo "::warning::ANAHTAR_B64 sırrı yok: APK hata ayıklama anahtarıyla imzalanacak (kurulur ama güncellemeler eskisinin üstüne kurulmaz)."
          fi
      - name: APK derle
        env:
          ANAHTAR_PAROLA: ${{ secrets.ANAHTAR_PAROLA }}
          ANAHTAR_TAKMA_AD: ${{ secrets.ANAHTAR_TAKMA_AD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease surumBilgisi --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/SuAltiSavunma.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/SuAltiSavunma.apk

  yayinla:
    name: Sürümü yayınla
    runs-on: ubuntu-24.04
    needs: [kontrol, windows, android]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dosyalar
      - name: Sürüm sayfasını oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TASLAK: ${{ github.event_name == 'workflow_dispatch' && inputs.taslak }}
          ETIKET: ${{ needs.kontrol.outputs.etiket }}
        run: |
          SURUM=$(sed -n 's:.*<version>\([0-9]*\.[0-9]*\.[0-9]*\)</version>.*:\1:p' pom.xml | head -1)
          if [ "${ETIKET}" != "v${SURUM}" ]; then echo "::warning::Etiket (${ETIKET}) pom.xml sürümüyle (v${SURUM}) aynı değil."; fi
          # Dosya adları sürümden bağımsızdır: .../releases/latest/download/SuAltiSavunma.apk her zaman en yeni APK'ya gider
          cp dosyalar/windows-zip/SuAltiSavunma-windows.zip SuAltiSavunma-Windows.zip
          cp dosyalar/android-apk/SuAltiSavunma.apk SuAltiSavunma.apk
          sha256sum SuAltiSavunma-Windows.zip SuAltiSavunma.apk > SHA256.txt
          BAYRAK=""
          if [ "${TASLAK}" = "true" ]; then BAYRAK="--draft"; fi
          if gh release view "${ETIKET}" >/dev/null 2>&1; then
            gh release upload "${ETIKET}" SuAltiSavunma-Windows.zip SuAltiSavunma.apk SHA256.txt --clobber
          else
            gh release create "${ETIKET}" SuAltiSavunma-Windows.zip SuAltiSavunma.apk SHA256.txt \
              --title "Su Altı Savunma ${ETIKET}" --notes-file .github/surum_notu.md --target "${GITHUB_SHA}" ${BAYRAK}
          fi

# Bağımlılıkları ve CI eylemlerini aylık denetler; güncelleme önerilerini çekme isteği olarak açar.
# Java/JavaFX (WebView davranışı ve performans ayarları) ile Android derleme araçları (AGP, Gradle) büyük sürümlere kendiliğinden geçmez:
# bunlar elle, tüm testler ve hız ölçümüyle yükseltilir.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [bagimlilik]
  - package-ecosystem: npm
    directory: /tools/e2e
    schedule:
      interval: monthly
    labels: [bagimlilik]
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: monthly
    labels: [bagimlilik]
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [bagimlilik]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [bagimlilik]
